<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#d6e9ff" />
    <meta name="description" content="Rutinas de limpieza guiadas con temporizador y voz." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>Rutinas de limpieza</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; background: #d6e9ff; min-height: 100vh; }
      * { -webkit-tap-highlight-color: transparent; }
      #root { width: 100%; }

      /* --- Fondo: limpieza de vidrio con limpiavidrios --- */
      .glass-bg { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
      .glass-fog {
        position: absolute; inset: 0;
        background:
          radial-gradient(120px 120px at 18% 30%, rgba(255,255,255,0.35), transparent 70%),
          radial-gradient(160px 160px at 78% 22%, rgba(255,255,255,0.28), transparent 70%),
          radial-gradient(140px 140px at 60% 70%, rgba(255,255,255,0.30), transparent 70%),
          radial-gradient(100px 100px at 30% 82%, rgba(255,255,255,0.26), transparent 70%);
        opacity: 0.9;
      }
      /* Manchas de limpieza cortas, intermitentes, en varias direcciones */
      .swipe { position: absolute; will-change: transform; }
      .swipe .mark {
        width: 100%; height: 100%; border-radius: 999px; opacity: 0;
        background: linear-gradient(90deg,
          rgba(255,255,255,0) 0%, rgba(255,255,255,0.55) 45%,
          rgba(255,255,255,0.22) 72%, rgba(255,255,255,0) 100%);
        filter: blur(3px);
        animation-name: wipeStroke; animation-timing-function: ease-in-out;
        animation-iteration-count: infinite;
      }
      @keyframes wipeStroke {
        0%   { transform: translateX(-38%) scaleX(0.7); opacity: 0; }
        6%   { opacity: 0.6; }
        20%  { transform: translateX(38%) scaleX(1);   opacity: 0.45; }
        28%  { opacity: 0; }
        100% { transform: translateX(38%); opacity: 0; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
